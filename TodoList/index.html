<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="todo-app">
            <div class="header">
                <h1>✓ My To-Do List</h1>
                <p class="subtitle">Keep track of your tasks</p>
            </div>

            <div class="input-section">
                <input 
                    type="text" 
                    id="todoInput" 
                    class="todo-input" 
                    placeholder="Add a new task..."
                    autocomplete="off"
                >
                <button class="add-btn" onclick="addTodo()">Add Task</button>
            </div>

            <div class="filter-section">
                <button class="filter-btn active" onclick="filterTodos('all')">All</button>
                <button class="filter-btn" onclick="filterTodos('active')">Active</button>
                <button class="filter-btn" onclick="filterTodos('completed')">Completed</button>
            </div>

            <div class="stats">
                <span>Total: <span id="totalCount">0</span></span>
                <span>Active: <span id="activeCount">0</span></span>
                <span>Completed: <span id="completedCount">0</span></span>
            </div>

            <div class="todo-list" id="todoList">
                <!-- Todo items will be added here -->
            </div>

            <div class="action-buttons">
                <button class="clear-completed-btn" onclick="clearCompleted()">Clear Completed</button>
                <button class="clear-all-btn" onclick="clearAllTodos()">Clear All</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
